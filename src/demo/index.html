<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>提醒演示 · 本地测试</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f8f7;color:#172f35;font:15px "Microsoft YaHei",sans-serif}header{background:#fff;padding:24px 36px;border-bottom:1px solid #dce8e4;display:flex;justify-content:space-between}header a{color:#147864;text-decoration:none}#unread{display:inline-block;background:#ef6b51;color:#fff;padding:2px 8px;border-radius:20px;min-width:26px;text-align:center}.content{max-width:760px;margin:65px auto;padding:0 30px}small{color:#168574;font-weight:700;letter-spacing:3px}h1{font-size:32px;line-height:1.5}p{line-height:1.9;color:#69817f}button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:12px 18px;background:#127b67;color:#fff;margin:8px 8px 24px 0}.secondary{background:#dcebe7;color:#245a50}.message{padding:24px;border:1px solid #dce8e4;border-radius:14px;background:#fff;min-height:100px}#latest{line-height:1.8}.label{font-size:12px;color:#829690;margin-bottom:12px}.notice{font-size:13px;border-left:3px solid #70b6a3;padding-left:14px;margin-top:30px}
</style></head><body><header><strong>Website Controller · 通知体验</strong><a href="#messages">消息 <span id="unread" data-unread-count="0">0</span></a></header><div class="content"><small>LOCAL DEMO</small><h1>亲自试试，消息如何抵达。</h1><p>这是软件自带的本地演示页，数据与光厂、站酷无关。点击下方按钮，然后切换到工作总览，或最小化软件，等待提醒到达。</p><button id="send">3 秒后收到一条演示消息</button><button id="read" class="secondary">清空演示未读</button><div class="message" id="messages"><div class="label">最新演示消息</div><div id="latest">暂时没有演示消息。</div></div><p class="notice">页面角标更新后，Website Controller会在消息中心记录提醒。系统开启通知且未开启免打扰时，会同时显示桌面通知。演示站点不会在下次启动时保留。</p></div><script src="/demo.js"></script></body></html>
