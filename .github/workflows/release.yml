name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            command: npm run build -- --x64 --publish never
            label: windows-x64
          - os: macos-15
            arch: arm64
            command: npm run build:mac -- --arm64 --publish never
            label: macos-arm64
          - os: macos-15-intel
            arch: x64
            command: npm run build:mac -- --x64 --publish never
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if ('v'+require('./package.json').version!==process.env.RELEASE_TAG) throw new Error('Tag and package version differ')"
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:network
      - run: ${{ matrix.command }}
      - name: Check packaged files
        run: node scripts/verify-package.cjs ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: node scripts/checksums.cjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Website Controller ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md" --latest
